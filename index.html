<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Oriol Pujol, mi villano favorito</title>
  <link rel="icon" href="favicon.png">
  <style>
    html,body{height:100%;margin:0}
    .stage{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;
      overflow:hidden
    }
    img.base{
      width:100%;height:100%;object-fit:cover;display:block
    }
    img.overlay{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
      opacity:0;transition:opacity 0.1s linear;pointer-events:none
    }
    @keyframes mouthCycle {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .cycling {
      animation: mouthCycle 0.2s infinite linear;
    }
    .slider-container{
      position:fixed;bottom:1rem;right:1rem;
      background:rgba(0,0,0,0.5);padding:.5rem;border-radius:.5rem;
      color:#fff;font-family:sans-serif;
      text-align:center;
    }
    .slider-container label{
      display:block;margin-bottom:.5rem;
    }
    .slider-container span{
      display:block;margin-top:.5rem;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 200px;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border:2px solid #000;
    }
    input[type=range]::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border:2px solid #000;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img src="1.png" alt="fons" class="base" />
    <img src="2.png" alt="overlay" class="overlay" id="overlay" />
  </div>

  <div class="slider-container">
    <label for="threshold">Sensibilitat</label>
    <input type="range" id="threshold" min="0.001" max="0.05" step="0.001" value="0.01">
    <span id="thresholdVal">0.01</span>
  </div>

  <script>
    const MAX_LEVEL = 0.25;
    let THRESHOLD = 0.01;

    const overlay = document.getElementById('overlay');
    const slider = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');

    slider.addEventListener('input', ()=>{
      THRESHOLD = parseFloat(slider.value);
      thresholdVal.textContent = THRESHOLD.toFixed(3);
    });

    let audioCtx, analyser, dataArray, source, rafId;
    let cycling = false;

    async function initMicrophone(){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        dataArray = new Float32Array(analyser.fftSize);
        source.connect(analyser);
        checkVolume();
      }catch(err){
        console.error(err);
      }
    }

    function rmsFromFloat32(buffer){
      let sum = 0;
      for(let i=0;i<buffer.length;i++){
        const v = buffer[i];
        sum += v*v;
      }
      return Math.sqrt(sum / buffer.length);
    }

    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

    function checkVolume(){
      analyser.getFloatTimeDomainData(dataArray);
      const rms = rmsFromFloat32(dataArray);
      let level = (rms - THRESHOLD) / (MAX_LEVEL - THRESHOLD);
      level = clamp(level, 0, 1);

      if(level > 0){
        if(!cycling){
          overlay.classList.add('cycling');
          cycling = true;
        }
      } else {
        if(cycling){
          overlay.classList.remove('cycling');
          overlay.style.opacity = '0';
          cycling = false;
        }
      }

      rafId = requestAnimationFrame(checkVolume);
    }

    (async ()=>{
      try{
        await initMicrophone();
      }catch(e){}
    })();

    window.addEventListener('pagehide', ()=>{ if(rafId) cancelAnimationFrame(rafId); });
  </script>
</body>
</html>
