<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Oriol Pujol, mi villano favorito</title>
  <link rel="icon" href="favicon.png">
  <style>
    html,body{height:100%;margin:0}
    .stage{
      position:fixed;inset:0;background:#fff;
      overflow:hidden;
    }
    /* REPLACED: make images fill the stage container but use contain so they never crop,
       and anchor the visible image to the left-bottom of the viewport */
    img.base,
    img.overlay {
      position: absolute;
      inset: 0;                 /* top:0; right:0; bottom:0; left:0; -> fill the stage */
      width: 100%;              /* fill container, but object-fit:contain prevents cropping */
      height: 100%;
      object-fit: contain;      /* show the whole image, as large as possible */
      object-position: left bottom; /* anchor image to left-bottom inside the container */
      display: block;
      pointer-events: none;
    }
    img.overlay{
      opacity:0;
      transition:opacity 0.1s linear;
    }
    @keyframes mouthCycle {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    .cycling {
      animation: mouthCycle 0.2s infinite linear;
    }
    .slider-container{
      position:fixed;bottom:1rem;right:1rem;
      background:rgba(0,0,0,0.5);padding:.5rem;border-radius:.5rem;
      color:#fff;font-family:sans-serif;
      text-align:center;
    }
    /* label now contains the numeric value on the right: "Sensibilitat: x%" */
    .slider-container label{
      display:flex;
      align-items:center;
      gap:0.5rem;
      justify-content:flex-start;
      margin-bottom:.5rem;
      font-weight:normal;
    }
    .slider-container label #thresholdVal{
      font-weight:700;
      min-width:3ch;
      text-align:right;
    }
    input[type=range] {
      -webkit-appearance: none;
      width: 200px;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border:2px solid #000;
    }
    input[type=range]::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border:2px solid #000;
    }
    @media (orientation: portrait) {
      .slider-container {
        top: 1rem;
        right: 1rem;
        bottom: auto;
      }
    }
    @media (orientation: landscape) {
      .slider-container {
        top: 1rem;
        right: 1rem;
        bottom: auto;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img src="1.png" alt="fons" class="base" />
    <img src="2.png" alt="overlay" class="overlay" id="overlay" />
  </div>

  <div class="slider-container">
    <label for="threshold">Sensibilitat: <span id="thresholdVal">80%</span></label>
    <input type="range" id="threshold" min="1" max="100" step="1" value="80">
  </div>

  <script>
    const MAX_LEVEL = 0.25;
    let THRESHOLD = 0.01;

    const overlay = document.getElementById('overlay');
    const slider = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');

    slider.addEventListener('input', ()=>{
      // Reverse the slider value (right = higher sensitivity)
      THRESHOLD = (101  - parseInt(slider.value, 10)) / 100 * 0.05; // Map percentage to threshold range
      thresholdVal.textContent = `${slider.value}%`; // Display percentage
    });

    let audioCtx, analyser, dataArray, source, rafId;
    let cycling = false;

    async function initMicrophone(){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        dataArray = new Float32Array(analyser.fftSize);
        source.connect(analyser);
        checkVolume();
      }catch(err){
        console.error(err);
      }
    }

    function rmsFromFloat32(buffer){
      let sum = 0;
      for(let i=0;i<buffer.length;i++){
        const v = buffer[i];
        sum += v*v;
      }
      return Math.sqrt(sum / buffer.length);
    }

    function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

    function checkVolume(){
      analyser.getFloatTimeDomainData(dataArray);
      const rms = rmsFromFloat32(dataArray);
      let level = (rms - THRESHOLD) / (MAX_LEVEL - THRESHOLD);
      level = clamp(level, 0, 1);

      if(level > 0){
        if(!cycling){
          overlay.classList.add('cycling');
          cycling = true;
        }
      } else {
        if(cycling){
          overlay.classList.remove('cycling');
          overlay.style.opacity = '0';
          cycling = false;
        }
      }

      rafId = requestAnimationFrame(checkVolume);
    }

    (async ()=>{
      try{
        await initMicrophone();
      }catch(e){}
    })();

    window.addEventListener('pagehide', ()=>{ if(rafId) cancelAnimationFrame(rafId); });
  </script>
</body>
</html>
